<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Compatibilidad de Contratación Remota en Venezuela{% endblock %}</title>
  <meta name="description" content="Base de datos pública, mantenida por la comunidad, sobre empresas que podrían admitir candidatos remotos basados en Venezuela." />
  <meta name="color-scheme" content="light dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ static_prefix|default('static') }}/main.css" />
  <script>
    // Apply persisted display prefs before paint to avoid a flash / reflow.
    (function () {
      try {
        var root = document.documentElement;
        var savedTheme = localStorage.getItem("rvh-theme");
        var dark = savedTheme
          ? savedTheme === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) root.setAttribute("data-theme", "dark");
        if (localStorage.getItem("rvh-density") === "compact") {
          root.setAttribute("data-density", "compact");
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main-content">Saltar al contenido</a>

  {% include "_nav.html" %}

  <main id="main-content" role="main">
    <noscript>
      <div class="page">
        <p class="noscript-notice">
          La búsqueda y los filtros requieren JavaScript. Sin él la tabla se muestra completa.
        </p>
      </div>
    </noscript>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="footer-inner">
      <p>
        Generado el {{ generated_at }} ·
        <a href="https://github.com/asdrubalivan/remote-venezuela-hiring">Código fuente en GitHub</a> ·
        <a href="https://github.com/asdrubalivan/remote-venezuela-hiring/issues/new?template=add-company.yml">
          Contribuye con una entrada
        </a>
      </p>
    </div>
  </footer>

  <script src="{{ static_prefix|default('static') }}/theme.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
