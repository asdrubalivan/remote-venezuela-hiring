<header class="navbar" role="banner">
  <div class="nav-inner">
    <a href="{{ home_url|default('./') }}" class="nav-brand" aria-label="Remote Venezuela Hiring — inicio">
      <span class="nav-logo" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
      </span>
      <span class="nav-brand-text">
        <span class="nav-brand-title">Remote Venezuela</span>
        <span class="nav-brand-kicker">🇻🇪 Hiring</span>
      </span>
    </a>

    <nav class="nav-links" aria-label="Navegación principal">
      <a href="{{ home_url|default('./') }}" class="nav-link{% if current_page == 'index' %} is-active{% endif %}">Empresas</a>
      <a href="{{ stats_url|default('./stats.html') }}" class="nav-link{% if current_page == 'stats' %} is-active{% endif %}">Estadísticas</a>
    </nav>

    <div class="nav-actions">
      <div class="nav-settings">
        <button type="button" class="nav-icon-btn" id="settings-toggle" data-testid="settings-toggle"
                aria-haspopup="true" aria-expanded="false" aria-controls="settings-menu"
                aria-label="Ajustes de visualización">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
        <div class="settings-menu" id="settings-menu" data-testid="settings-menu" role="group"
             aria-label="Ajustes de visualización" hidden>
          <div class="settings-group">
            <div class="settings-menu-label">Tema</div>
            <div class="settings-seg" role="radiogroup" aria-label="Tema">
              <button type="button" class="settings-seg-btn" role="radio" data-theme="light"
                      data-testid="theme-light" aria-checked="true" aria-label="Tema claro">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="12" cy="12" r="4"/>
                  <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
                </svg>
              </button>
              <button type="button" class="settings-seg-btn" role="radio" data-theme="dark"
                      data-testid="theme-dark" aria-checked="false" aria-label="Tema oscuro">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="settings-group">
            <div class="settings-menu-label">Densidad de la tabla</div>
            <div class="settings-seg" role="radiogroup" aria-label="Densidad de la tabla">
              <button type="button" class="settings-seg-btn" role="radio" data-density="comfortable"
                      data-testid="density-comfortable" aria-checked="true">Cómoda</button>
              <button type="button" class="settings-seg-btn" role="radio" data-density="compact"
                      data-testid="density-compact" aria-checked="false">Compacta</button>
            </div>
          </div>
        </div>
      </div>

      <a class="nav-github" href="https://github.com/asdrubalivan/remote-venezuela-hiring" target="_blank" rel="noopener noreferrer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
        </svg>
        <span class="nav-github-label">GitHub</span>
      </a>
    </div>
  </div>
</header>
