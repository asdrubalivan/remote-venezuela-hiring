<header class="navbar">
  <div class="nav-inner">
    <a href="{{ home_url|default('./') }}" class="nav-brand" aria-label="Remote Venezuela Hiring — inicio">
      <svg class="flag" aria-hidden="true" focusable="false"><use href="#i-flag" /></svg>
      <span class="nav-brand-text">
        <span class="nav-brand-title">Remote Venezuela</span>
        <span class="nav-brand-kicker">Hiring</span>
      </span>
    </a>

    <nav class="nav-links" aria-label="Navegación principal">
      <a href="{{ home_url|default('./') }}" class="nav-link"{% if current_page == 'index' %} aria-current="page"{% endif %}>Empresas</a>
      <a href="{{ stats_url|default('./stats.html') }}" class="nav-link"{% if current_page == 'stats' %} aria-current="page"{% endif %}>Estadísticas</a>
    </nav>

    <div class="nav-actions">
      <button type="button" class="nav-icon-btn" id="settings-toggle" data-testid="settings-toggle"
              aria-haspopup="true" aria-expanded="false" aria-controls="settings-menu"
              aria-label="Ajustes de visualización">
        <svg class="ico" aria-hidden="true" focusable="false"><use href="#i-gear" /></svg>
      </button>
      <div class="settings-menu" id="settings-menu" data-testid="settings-menu" role="group"
           aria-label="Ajustes de visualización" hidden>
        <div class="settings-menu-label" id="settings-theme-label">Tema</div>
        <div class="settings-seg" role="radiogroup" aria-labelledby="settings-theme-label">
          <button type="button" class="settings-seg-btn" role="radio" data-theme="light"
                  data-testid="theme-light" aria-checked="true" aria-label="Tema claro">
            <svg class="ico" aria-hidden="true" focusable="false"><use href="#i-sun" /></svg>
          </button>
          <button type="button" class="settings-seg-btn" role="radio" data-theme="dark"
                  data-testid="theme-dark" aria-checked="false" aria-label="Tema oscuro">
            <svg class="ico" aria-hidden="true" focusable="false"><use href="#i-moon" /></svg>
          </button>
        </div>
        <div class="settings-menu-label" id="settings-density-label">Densidad de la tabla</div>
        <div class="settings-seg" role="radiogroup" aria-labelledby="settings-density-label">
          <button type="button" class="settings-seg-btn" role="radio" data-density="comfortable"
                  data-testid="density-comfortable" aria-checked="true">Cómoda</button>
          <button type="button" class="settings-seg-btn" role="radio" data-density="compact"
                  data-testid="density-compact" aria-checked="false">Compacta</button>
        </div>
      </div>

      <a class="nav-github" href="https://github.com/asdrubalivan/remote-venezuela-hiring" target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>
  </div>
</header>
