# Run every gate on every push and pull request.
# Fails fast on lint/format/type/test/data errors before anything reaches main.
name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: lint, type-check, test, validate data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable corepack + pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.2 --activate

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type-check (strict)
        run: pnpm run typecheck

      - name: Build frontend bundle
        run: pnpm run build:js

      - name: Install Python package
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Mypy (strict)
        run: mypy

      - name: Validate company YAML data
        run: python -m remote_venezuela_hiring.validate_data

      - name: Pytest
        run: pytest -q

      - name: Build site (smoke test)
        run: python -m remote_venezuela_hiring.build_site
