# Run every gate on every push and pull request.
# Fails fast on lint/format/type/test/data errors before anything reaches main.
name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: lint, type-check, test, validate data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable corepack + pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.2 --activate

      - name: Install Node dependencies
        # `--config.strict-dep-builds=false`: pnpm 11 exits 1 in CI when
        # a build script is "ignored" (esbuild's postinstall). The
        # esbuild binary actually ships in @esbuild/<arch>, so we don't
        # need the postinstall — silence the warning and continue.
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false

      # Invoke tools directly (not via `pnpm run`) so pnpm's pre-script
      # deps-status-check doesn't re-trigger ERR_PNPM_IGNORED_BUILDS.
      - name: TypeScript type-check (strict)
        run: ./node_modules/.bin/tsc --noEmit

      - name: Build frontend bundle
        run: node scripts/build-js.mjs

      - name: Install Python package
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Mypy (strict)
        run: mypy

      - name: Validate company YAML data
        run: python -m remote_venezuela_hiring.validate_data

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Pytest (unit + E2E)
        run: pytest -q

      - name: Build site (smoke test)
        run: python -m remote_venezuela_hiring.build_site

      - name: Check README table is up to date
        run: |
          python -m remote_venezuela_hiring.update_readme
          git diff --exit-code README.md || {
            echo ""
            echo "README.md is out of date. Run: make update-readme"
            exit 1
          }
