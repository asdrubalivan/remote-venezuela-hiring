# Run every gate on every push and pull request.
# Fails fast on lint/format/type/test/data errors before anything reaches main.
name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: lint, type-check, test, validate data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Mypy (strict)
        run: mypy

      - name: Validate company YAML data
        run: python -m remote_venezuela_hiring.validate_data

      - name: Pytest
        run: pytest -q

      - name: Build site (smoke test)
        run: python -m remote_venezuela_hiring.build_site
