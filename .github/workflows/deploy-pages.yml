# Build the static site and deploy it to GitHub Pages.
#
# Runs after a merge to main. The validate workflow gates merges, so by the
# time this fires the data is already known to be valid.
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow only one concurrent deployment. Skip queued runs but never cancel an
# in-progress one — half-deployed Pages output is worse than a brief delay.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable corepack + pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.2 --activate

      - name: Install Node dependencies
        # See validate.yml for rationale; esbuild's postinstall is
        # optional under pnpm 11 — the binary ships in @esbuild/<arch>.
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false

      # Invoke node directly (not via `pnpm run`) so pnpm's pre-script
      # deps-status-check doesn't re-trigger ERR_PNPM_IGNORED_BUILDS.
      - name: Build frontend bundle (TypeScript → static/*.js)
        run: node scripts/build-js.mjs

      - name: Install Python package
        run: pip install -e .

      - name: Validate data before build
        run: python -m remote_venezuela_hiring.validate_data

      - name: Build site
        run: python -m remote_venezuela_hiring.build_site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
