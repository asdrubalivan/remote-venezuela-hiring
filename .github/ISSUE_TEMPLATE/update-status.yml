name: Actualizar estado de una empresa
description: Reporta un cambio en cómo una empresa trata a candidatos basados en Venezuela.
title: "[update] <nombre de la empresa>"
labels: ["update-status", "submission"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por mantener la información al día. Asegúrate de que tu reporte
        sea **factual y verificable**.

  - type: input
    id: id
    attributes:
      label: ID de la empresa
      description: Identificador kebab-case usado como nombre de archivo en data/companies/.
      placeholder: "proxify"
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Nuevo estado
      options:
        - accepts
        - rejects
        - unknown
    validations:
      required: true

  - type: dropdown
    id: verification_method
    attributes:
      label: ¿Cómo lo verificaste?
      options:
        - application_form
        - recruiter
        - public_job_post
        - community_report
        - unknown
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notas del cambio
      description: ¿Qué cambió? Sin datos personales. Máximo 500 caracteres.
      placeholder: "El formulario ahora muestra mensaje de país no soportado."

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmación
      options:
        - label: La información que aporto es factual y observable.
          required: true
        - label: No incluí datos personales.
          required: true
